<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Explainable Alert Dashboard — CAPSTONE-189</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --critical: #e5484d;
    --high: #f5a524;
    --medium: #f6e05e;
    --low: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  #status { font-size: 13px; color: var(--muted); }
  #status.connected { color: var(--low); }
  #alerts {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  .alert-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: 8px;
    padding: 12px 16px;
    animation: fadeIn 0.25s ease-out;
  }
  .alert-card.CRITICAL { border-left-color: var(--critical); }
  .alert-card.HIGH { border-left-color: var(--high); }
  .alert-card.MEDIUM { border-left-color: var(--medium); }
  .alert-card.LOW { border-left-color: var(--low); }
  .alert-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .alert-entity { font-weight: 600; font-size: 15px; }
  .alert-score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .alert-meta { margin-top: 6px; font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge.CRITICAL { background: rgba(229,72,77,0.15); color: var(--critical); }
  .badge.HIGH { background: rgba(245,165,36,0.15); color: var(--high); }
  .badge.MEDIUM { background: rgba(246,224,94,0.15); color: var(--medium); }
  .badge.LOW { background: rgba(62,207,142,0.15); color: var(--low); }
  #empty { color: var(--muted); text-align: center; padding: 60px 0; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <header>
    <h1>Explainable Alert Dashboard</h1>
    <span id="status">connecting…</span>
  </header>

  <div id="alerts">
    <div id="empty">Waiting for alerts…</div>
  </div>

  <script>
    const alertsEl = document.getElementById("alerts");
    const statusEl = document.getElementById("status");
    const emptyEl = document.getElementById("empty");
    const MAX_CARDS = 100;

    function connect() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${protocol}//${window.location.host}/alerts/stream`);

      ws.onopen = () => {
        statusEl.textContent = "live";
        statusEl.classList.add("connected");
      };

      ws.onclose = () => {
        statusEl.textContent = "disconnected — retrying…";
        statusEl.classList.remove("connected");
        setTimeout(connect, 2000);
      };

      ws.onerror = () => ws.close();

      ws.onmessage = (event) => {
        try {
          const alert = JSON.parse(event.data);
          renderAlert(alert);
        } catch (err) {
          console.error("Failed to parse alert payload", err);
        }
      };
    }

    function renderAlert(alert) {
      if (emptyEl) emptyEl.remove();

      const card = document.createElement("div");
      card.className = `alert-card ${alert.severity}`;

      const relatedText = (alert.related_ids || []).length
        ? `related: ${alert.related_ids.join(", ")}`
        : "no related incidents";

      card.innerHTML = `
        <div class="alert-top">
          <span class="alert-entity">${escapeHtml(alert.entity_id)}
            <span class="badge ${alert.severity}">${alert.severity}</span>
            <span class="badge ${alert.severity}">${alert.sev_level}</span>
          </span>
          <span class="alert-score">score ${alert.final_score.toFixed(3)}</span>
        </div>
        <div class="alert-meta">
          <span>${escapeHtml(alert.cloud_provider)} / ${escapeHtml(alert.region)}</span>
          <span>team: ${escapeHtml(alert.target_team)}</span>
          <span>group: ${escapeHtml(alert.group_type)}</span>
          <span>${escapeHtml(relatedText)}</span>
          <span>${new Date(alert.batch_ts).toLocaleString()}</span>
        </div>
      `;

      alertsEl.prepend(card);
      while (alertsEl.children.length > MAX_CARDS) {
        alertsEl.removeChild(alertsEl.lastChild);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    connect();
  </script>
</body>
</html>
