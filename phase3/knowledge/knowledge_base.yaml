kb_version: "2026.10.09.1"
causes:
  - cause_category: "CREDENTIAL_THEFT"
    title: "Possible credential misuse"
    definition: "Unusual sign-in context combined with a credential reset or identity-policy change can be consistent with compromised or misused credentials."
    how_it_shows_up: "This category is selected only when suspicious_login_location is paired with credential_reset_spike or iam_policy_change and the final score meets the configured threshold."
    common_causes:
      - "A stolen or exposed credential may be used from an unexpected location."
      - "A legitimate user may be traveling or using a newly approved network."
      - "A scheduled credential rotation or identity-policy update may explain the change."
    why_it_matters: "Identity misuse can provide access to cloud resources, but these signals alone do not establish who performed an action or whether access was unauthorized."
    recommended_checks:
      - check: "Compare the sign-in timestamp, source location, identity, and session identifier with the identity provider audit record."
        why: "This checks whether the location signal belongs to the affected principal and session."
        expected_result: "The audit record either corroborates the alert context or identifies an expected session or data mismatch."
        risk: "LOW"
      - check: "Review recent credential-reset and identity-policy audit events for the affected principal."
        why: "The matched indicators include a reset or policy change that should be attributable to a known actor or workflow."
        expected_result: "The change is linked to an approved request or remains unverified for analyst review."
        risk: "LOW"
    limitations: "Location can be affected by VPNs, proxies, mobile networks, and incomplete geolocation data. This category is an investigative lead, not a finding of compromise."
    further_reading: "Use the organization's identity-provider audit records and approved access-change history."
  - cause_category: "PRIVILEGE_ESCALATION"
    title: "Possible privilege escalation"
    definition: "A privilege-escalation indicator occurring with unusual file access or data-transfer behavior can suggest that an identity or workload accessed capabilities beyond its established pattern."
    how_it_shows_up: "This category requires privilege_escalation_attempt together with file_access_spike or new_data_exfiltration_pattern and a final score above the configured threshold."
    common_causes:
      - "An unapproved permission grant or role assumption may have expanded access."
      - "A deployment, incident response task, or scheduled automation may have used elevated permissions legitimately."
      - "A change in workload or telemetry coverage may produce a partial or misleading sequence."
    why_it_matters: "Unexpected privilege use can increase the impact of an identity compromise; the event sequence and authorization context must be verified before drawing conclusions."
    recommended_checks:
      - check: "Review the cloud audit events for the principal, role assumption, and permission changes in the alert window."
        why: "The authorization record can show which identity requested elevated access and which policy allowed it."
        expected_result: "The activity maps to an approved operator or automation, or remains unexplained and ready for escalation."
        risk: "LOW"
      - check: "Correlate file-access or transfer audit metadata with the same principal and time window."
        why: "Correlation distinguishes a matched sequence from unrelated signals on the same resource."
        expected_result: "The events share a principal/session and have a known operational explanation, or the gap is documented."
        risk: "LOW"
    limitations: "The category does not prove data was exfiltrated or that permissions were abused. It is based on the supplied features and may omit events outside the collection window."
    further_reading: "Consult cloud IAM audit history, role-assumption logs, and approved change records."
  - cause_category: "NETWORK_RECONNAISSANCE"
    title: "Possible network reconnaissance"
    definition: "A port-scan indicator combined with discovery of new IPs or a lateral-probe burst can be consistent with systematic service or asset discovery."
    how_it_shows_up: "This category requires port_scan_count together with new_ip_discovery or lateral_probe_burst and a final score above the configured threshold."
    common_causes:
      - "An unauthorized actor may be mapping reachable services or adjacent resources."
      - "An approved vulnerability scanner, inventory job, or deployment health check may create similar traffic."
      - "A network change or incomplete flow-log coverage may distort observed scan volume."
    why_it_matters: "Reconnaissance can precede access attempts, but scan-like traffic alone does not demonstrate successful access or malicious intent."
    recommended_checks:
      - check: "Review network-flow and firewall metadata for the source, destination, port range, rate, and time window."
        why: "These fields establish whether the signal is a broad probe, a bounded health check, or a parsing artifact."
        expected_result: "The traffic pattern is attributable to an approved scanner or is documented for security review."
        risk: "LOW"
      - check: "Compare the source identity and target set with the approved scanner inventory and recent change records."
        why: "Known inventory and maintenance activity can explain otherwise unusual discovery traffic."
        expected_result: "The source and target scope match an approved activity or remain unrecognized."
        risk: "LOW"
    limitations: "Network discovery indicators are not proof of exploitation. NAT, shared egress, sampling, and missing flow records can obscure source attribution."
    further_reading: "Use read-only network-flow, firewall, and approved scanner inventory records for corroboration."
  - cause_category: "BEHAVIOR_CHANGE"
    title: "Behavioral drift"
    definition: "The observed workload or signal pattern deviates materially from the entity's recent baseline."
    how_it_shows_up: "The entity's deviation score climbs sharply while core metrics drift outside the normal pattern."
    common_causes:
      - "A workload change or sudden traffic spike"
      - "A release or config adjustment that changes a system's behavior"
      - "Deployment drift caused by a dependency or scaling event"
    why_it_matters: "This form of change often precedes service degradation even when the system remains technically healthy."
    recommended_checks:
      - check: "Review the last deploy or configuration change for this entity"
        why: "A recent code or config change is the most common cause of a sharp behavior shift."
        expected_result: "One or two recent changes explain the deviation."
        risk: "LOW"
      - check: "Compare recent resource usage against the prior 7-day baseline"
        why: "Behavioral baselines highlight whether the change is explainable or anomalous."
        expected_result: "Usage falls outside the expected range for the entity."
        risk: "LOW"
    limitations: "This classification is strongest when the window is recent and the baseline is stable."
    further_reading: "Use entity-specific telemetry and deployment history to validate root cause."
  - cause_category: "DRIFT"
    title: "Statistical drift"
    definition: "The entity's signal distribution has shifted enough to diverge from the prior operating envelope."
    how_it_shows_up: "The drift score rises and the feature distribution no longer matches the historical pattern."
    common_causes:
      - "Seasonality or workload mix changes"
      - "Upstream dependency timing or noisy telemetry"
      - "Bad data collection or sampling changes"
    why_it_matters: "Drift is evidence of data or behavior moving outside the expected envelope, even if user impact is not yet obvious."
    recommended_checks:
      - check: "Inspect the drift components and compare them with the previous baseline"
        why: "Drift often explains why a case started to look abnormal before the health score crossed a threshold."
        expected_result: "The distribution shift is clear and reproducible."
        risk: "LOW"
    limitations: "Drift alone does not prove a service outage or root cause."
    further_reading: "Cross-check with recent operational changes and feature-level variance."
  - cause_category: "RESOURCE_CHANGE"
    title: "Resource profile change"
    definition: "The entity now resembles a different workload or scale profile than it did before."
    how_it_shows_up: "Similarity and related incident history show this entity now aligns with a different resource pattern."
    common_causes:
      - "Capacity expansion or contract migration"
      - "Instance or cluster replacement"
      - "Regional traffic reshaping"
    why_it_matters: "A changed resource profile can amplify customer-facing issues even if the core service has not failed."
    recommended_checks:
      - check: "Review the resource metadata and recent resizing history"
        why: "Resource shape changes are common before a shift in demand or capacity pattern."
        expected_result: "A workload or cluster change matches the evidence."
        risk: "LOW"
    limitations: "This is comparative evidence and should be verified with operational records."
    further_reading: "Match the entity against similar historical episodes and resource inventories."
  - cause_category: "UNKNOWN"
    title: "Unknown or insufficient evidence"
    definition: "The case does not yet match a confident rule and needs a manual review."
    how_it_shows_up: "The score is low or the available evidence is sparse, conflicting, or incomplete."
    common_causes:
      - "Insufficient telemetry"
      - "New failure mode"
      - "Transient or noisy incident"
    why_it_matters: "Unknowns are often the earliest indicator of a new or missing class of issue."
    recommended_checks:
      - check: "Review raw telemetry and incident annotations from the last 2-4 hours"
        why: "Unknown cases usually need more signal before an actionable classification can be reached."
        expected_result: "A clear pattern emerges after additional telemetry review."
        risk: "MEDIUM"
    limitations: "Without enough evidence, the system should avoid overconfident conclusions."
    further_reading: "Continue to collect feature-level evidence before escalating."
signals:
  - signal: "deviation"
    description: "Difference between current behavior and the entity's established baseline."
  - signal: "drift"
    description: "Distributional shift relative to the expected feature envelope."
  - signal: "similarity"
    description: "How closely the current profile resembles known historical incidents or workload patterns."
confidence_levels:
  HIGH: "Strong evidence across multiple independent signals; the classification is stable."
  MEDIUM: "One signal is strong or several are weakly aligned, but there is still some uncertainty."
  LOW: "Evidence is sparse, conflicting, or insufficient for a confident conclusion."
