    title: "Possible gradual workload growth"
    definition: "Gradual request or storage changes may be consistent with organic demand growth, but the pattern should be checked against business and capacity context."
    how_it_shows_up: "The case has ${top_changed_feature} changing with drift=${drift_score}; compare with demand and release trends."
    typical_stages: ["Demand grows over time.", "Requests and storage use rise gradually.", "Capacity planning may need adjustment."]
    mitre_attack: []
    indicators_in_this_case: [changed_features, component_scores, observed_window]
    investigative_checks:
      - {check: "Compare request and storage trends with customer demand, known launches, and seasonal behavior.", why: "Trend context distinguishes expected growth from an unexplained burst.", expected_result: "The change follows a known demand or product trend.", risk: "LOW"}
    mitigation:
      immediate:
        - generic: "No incident response is implied; your team can check service capacity and customer impact."
      short_term:
        - generic: "Your team can update capacity forecasts if growth is sustained and expected."
      hardening:
        - generic: "Your team can review thresholds to distinguish gradual growth from abrupt behavior changes."
