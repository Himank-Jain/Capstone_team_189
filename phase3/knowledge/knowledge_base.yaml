    mitre_attack:
      - {id: "T1496", name: "Resource Hijacking", url: "https://attack.mitre.org/techniques/T1496/"}
    indicators_in_this_case: [changed_features, component_scores, cloud_provider, region]
    investigative_checks:
      - {check: "Review invocation counts, trigger configuration, duration, concurrency, and function deployment history.", why: "A planned release or event can explain a surge.", expected_result: "The trigger and deployment have a known owner or remain unexplained.", risk: "LOW"}
      - {check: "Compare request source and execution role with expected callers.", why: "Invocation volume alone does not identify who called the function.", expected_result: "The caller and role are expected or documented for review.", risk: "LOW"}
    mitigation:
      immediate:
        - generic: "Your team can consider a scoped trigger or concurrency limit for confirmed unexpected activity after assessing customer impact."
          aws: "Consider Lambda reserved concurrency, event-source mapping, and CloudTrail."
          azure: "Consider Function App scale limits, trigger configuration, and Activity Log."
          gcp: "Consider Cloud Functions/Cloud Run scaling limits and Cloud Audit Logs."
          oci: "Consider Functions application configuration, IAM, and OCI Audit."
      short_term:
        - generic: "Your team can review function code provenance, trigger permissions, execution identity, and cost telemetry."
      hardening:
        - generic: "Your team can use least-privilege execution roles, invocation budgets, and alerts for unusual duration or concurrency."
          aws: "Consider Lambda monitoring with CloudWatch alarms and GuardDuty."
          azure: "Consider Application Insights and Defender for Cloud."
          gcp: "Consider Cloud Monitoring and Security Command Center."
          oci: "Consider OCI Monitoring alarms and Cloud Guard."
    false_positive_notes: "Scheduled jobs, retries, deployment tests, seasonal demand, and legitimate event bursts can raise invocation or duration metrics."
    resolution_criteria: ["Trigger, caller, and deployment are attributed.", "Unexpected invocation is stopped or explained by the customer's team.", "Concurrency, duration, and cost return to an accepted range."]
    limitations: "No function source code, request body, or caller identity is inferred from aggregate metrics."
    further_reading:
      - {title: "MITRE ATT&CK Resource Hijacking", url: "https://attack.mitre.org/techniques/T1496/"}

  benign_baseline:
    public_id: stable_baseline_activity
    title: "Possible stable baseline activity"
    definition: "The low-amplitude pattern may be consistent with routine operation near an established baseline; this is not a guarantee of system health."
    how_it_shows_up: "For ${entity_id}, scores are deviation=${deviation_score} and drift=${drift_score}; compare the window with the entity's normal operating range."
    typical_stages: ["Routine workloads emit expected activity.", "Small variations appear within normal operating limits.", "Periodic review confirms baseline quality."]
    mitre_attack: []
    indicators_in_this_case: [changed_features, component_scores, observed_window]
    investigative_checks:
      - {check: "Compare current CPU, request, and storage metrics with the entity's recent baseline.", why: "A stable-looking score can still mask an important metric-specific change.", expected_result: "The observed range fits an approved operating envelope.", risk: "LOW"}
    mitigation:
      immediate:
        - generic: "No remediation is implied; your team can review the dashboard and investigate any operational concern."
      short_term:
        - generic: "Your team can confirm the baseline window includes representative workload periods."
      hardening:
        - generic: "Your team can keep baseline and telemetry coverage reviews on a regular schedule."
    false_positive_notes: "A newly degraded or low-frequency signal can appear normal if the baseline is stale or telemetry is missing."
    resolution_criteria: ["The activity is within an approved baseline.", "There is no unresolved operational impact or telemetry gap."]
    limitations: "An unsupervised detector cannot prove benign intent or absence of an attack."
    further_reading:
      - {title: "Google Cloud audit logs overview", url: "https://cloud.google.com/logging/docs/audit"}

  planned_deployment:
    public_id: deployment_related_change
    title: "Possible planned deployment activity"
    definition: "A bounded CPU and write change may be consistent with an approved deployment; the case does not know whether a change was planned."
    how_it_shows_up: "CPU or write activity changed for ${entity_id}; verify the deployment window, release owner, and expected capacity."
    typical_stages: ["A deployment or migration begins.", "Resource use changes during rollout.", "Metrics settle after the release."]
    mitre_attack: []
    indicators_in_this_case: [changed_features, component_scores, observed_window, related_incidents]
    investigative_checks:
      - {check: "Compare the window with the release calendar, change ticket, and deployment telemetry.", why: "A matching timestamp alone does not establish approval.", expected_result: "The change has an owner and an expected resource profile.", risk: "LOW"}
    mitigation:
      immediate:
        - generic: "No security action is implied; your team can verify release health and follow the normal rollback decision process."
      short_term:
        - generic: "Your team can compare observed resource use with the deployment's expected post-release envelope."
      hardening:
        - generic: "Your team can annotate approved releases in operational telemetry to improve future context."
    false_positive_notes: "Unapproved changes, autoscaling, or a coincident independent event can overlap a deployment window."
    resolution_criteria: ["The release and owner are verified.", "Service health is acceptable after rollout.", "Any unexplained activity is tracked separately."]
    limitations: "The platform does not read change tickets and cannot confirm deployment approval."
    further_reading:
      - {title: "AWS CloudTrail User Guide", url: "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html"}

  organic_growth:
