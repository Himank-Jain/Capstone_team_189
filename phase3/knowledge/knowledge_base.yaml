  provider_regional_event:
    public_id: provider_regional_service_event
    title: "Possible provider or regional service event"
    definition: "Correlated latency or error changes may be consistent with a regional service issue; the platform cannot independently confirm provider status."
    how_it_shows_up: "The ${cloud_provider} ${region} case shows latency or error changes during the observed time window; compare with provider health notices."
    typical_stages: ["A provider or regional dependency degrades.", "Affected workloads show latency or errors.", "Service metrics recover as the dependency stabilizes."]
    mitre_attack: []
    indicators_in_this_case: [cloud_provider, region, changed_features, component_scores]
    investigative_checks:
      - {check: "Compare the exact services and region with the provider health dashboard and service advisories.", why: "A broad regional label may include unaffected services.", expected_result: "A matching provider event is confirmed or ruled out for the affected services.", risk: "LOW"}
    mitigation:
      immediate:
        - generic: "Your team can follow its provider incident and continuity process; this platform does not change routing or infrastructure."
      short_term:
        - generic: "Your team can correlate customer impact and dependency-level telemetry with provider updates."
      hardening:
        - generic: "Your team can review resilience, retry behavior, and tested failover for critical dependencies."
    false_positive_notes: "Tenant-specific releases, quota limits, network configuration, and client retries can mimic regional degradation."
    resolution_criteria: ["Affected provider services and customer impact are documented.", "Recovery is confirmed through telemetry and provider status.", "Any tenant-side contributing change has an owner."]
    limitations: "No provider status API is called; this category is a hypothesis based on the case evidence."
    further_reading:
      - {title: "AWS Health User Guide", url: "https://docs.aws.amazon.com/health/latest/ug/what-is-aws-health.html"}

