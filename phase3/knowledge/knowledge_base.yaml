kb_version: "2.2.0"
causes:
  - cause_category: "CREDENTIAL_THEFT"
    title: "Possible credential misuse"
    definition: "Unusual sign-in context combined with a credential reset or identity-policy change can be consistent with compromised or misused credentials."
    how_it_shows_up: "This category is selected only when suspicious_login_location is paired with credential_reset_spike or iam_policy_change and the final score meets the configured threshold."
    common_causes:
      - "A stolen or exposed credential may be used from an unexpected location."
      - "A legitimate user may be traveling or using a newly approved network."
      - "A scheduled credential rotation or identity-policy update may explain the change."
    why_it_matters: "Identity misuse can provide access to cloud resources, but these signals alone do not establish who performed an action or whether access was unauthorized."
    recommended_checks:
      - check: "Compare the sign-in timestamp, source location, identity, and session identifier with the identity provider audit record."
        why: "This checks whether the location signal belongs to the affected principal and session."
        expected_result: "The audit record either corroborates the alert context or identifies an expected session or data mismatch."
        risk: "LOW"
      - check: "Review recent credential-reset and identity-policy audit events for the affected principal."
        why: "The matched indicators include a reset or policy change that should be attributable to a known actor or workflow."
        expected_result: "The change is linked to an approved request or remains unverified for analyst review."
        risk: "LOW"
    limitations: "Location can be affected by VPNs, proxies, mobile networks, and incomplete geolocation data. This category is an investigative lead, not a finding of compromise."
    further_reading: "Use the organization's identity-provider audit records and approved access-change history."
  - cause_category: "PRIVILEGE_ESCALATION"
    title: "Possible privilege escalation"
    definition: "A privilege-escalation indicator occurring with unusual file access or data-transfer behavior can suggest that an identity or workload accessed capabilities beyond its established pattern."
    how_it_shows_up: "Selected when privilege_escalation_attempt occurs with file_access_spike or new_data_exfiltration_pattern above the configured score threshold, or when the versioned privilege- and policy-misuse signature (privileged API calls, policy changes, or storage reads increasing) matches with MEDIUM or HIGH confidence."
    common_causes:
      - "An unapproved permission grant or role assumption may have expanded access."
      - "A deployment, incident response task, or scheduled automation may have used elevated permissions legitimately."
      - "A change in workload or telemetry coverage may produce a partial or misleading sequence."
    why_it_matters: "Unexpected privilege use can increase the impact of an identity compromise; the event sequence and authorization context must be verified before drawing conclusions."
    recommended_checks:
      - check: "Review the cloud audit events for the principal, role assumption, and permission changes in the alert window."
        why: "The authorization record can show which identity requested elevated access and which policy allowed it."
        expected_result: "The activity maps to an approved operator or automation, or remains unexplained and ready for escalation."
        risk: "LOW"
      - check: "Correlate file-access or transfer audit metadata with the same principal and time window."
        why: "Correlation distinguishes a matched sequence from unrelated signals on the same resource."
        expected_result: "The events share a principal/session and have a known operational explanation, or the gap is documented."
        risk: "LOW"
    limitations: "The category does not prove data was exfiltrated or that permissions were abused. It is based on the supplied features and may omit events outside the collection window."
    further_reading: "Consult cloud IAM audit history, role-assumption logs, and approved change records."
  - cause_category: "NETWORK_RECONNAISSANCE"
    title: "Possible network reconnaissance"
    definition: "A port-scan indicator combined with discovery of new IPs or a lateral-probe burst can be consistent with systematic service or asset discovery."
    how_it_shows_up: "Selected when port_scan_count occurs with new_ip_discovery or lateral_probe_burst above the configured score threshold, or when the versioned reconnaissance signature (application requests and east-west connections increasing) matches with MEDIUM or HIGH confidence."
    common_causes:
      - "An unauthorized actor may be mapping reachable services or adjacent resources."
      - "An approved vulnerability scanner, inventory job, or deployment health check may create similar traffic."
      - "A network change or incomplete flow-log coverage may distort observed scan volume."
    why_it_matters: "Reconnaissance can precede access attempts, but scan-like traffic alone does not demonstrate successful access or malicious intent."
    recommended_checks:
      - check: "Review network-flow and firewall metadata for the source, destination, port range, rate, and time window."
        why: "These fields establish whether the signal is a broad probe, a bounded health check, or a parsing artifact."
        expected_result: "The traffic pattern is attributable to an approved scanner or is documented for security review."
        risk: "LOW"
      - check: "Compare the source identity and target set with the approved scanner inventory and recent change records."
        why: "Known inventory and maintenance activity can explain otherwise unusual discovery traffic."
        expected_result: "The source and target scope match an approved activity or remain unrecognized."
        risk: "LOW"
    limitations: "Network discovery indicators are not proof of exploitation. NAT, shared egress, sampling, and missing flow records can obscure source attribution."
    further_reading: "Use read-only network-flow, firewall, and approved scanner inventory records for corroboration."
  - cause_category: "BEHAVIOR_CHANGE"
    title: "Behavioral drift"
    definition: "The observed workload or signal pattern deviates materially from the entity's recent baseline."
    how_it_shows_up: "The entity's deviation score climbs sharply while core metrics drift outside the normal pattern."
    common_causes:
      - "A workload change or sudden traffic spike"
      - "A release or config adjustment that changes a system's behavior"
      - "Deployment drift caused by a dependency or scaling event"
    why_it_matters: "This form of change often precedes service degradation even when the system remains technically healthy."
    recommended_checks:
      - check: "Review the last deploy or configuration change for this entity"
        why: "A recent code or config change is the most common cause of a sharp behavior shift."
        expected_result: "One or two recent changes explain the deviation."
        risk: "LOW"
      - check: "Compare recent resource usage against the prior 7-day baseline"
        why: "Behavioral baselines highlight whether the change is explainable or anomalous."
        expected_result: "Usage falls outside the expected range for the entity."
        risk: "LOW"
    limitations: "This classification is strongest when the window is recent and the baseline is stable."
    further_reading: "Use entity-specific telemetry and deployment history to validate root cause."
  - cause_category: "DRIFT"
    title: "Statistical drift"
    definition: "The entity's signal distribution has shifted enough to diverge from the prior operating envelope."
    how_it_shows_up: "The drift score rises and the feature distribution no longer matches the historical pattern."
    common_causes:
      - "Seasonality or workload mix changes"
      - "Upstream dependency timing or noisy telemetry"
      - "Bad data collection or sampling changes"
    why_it_matters: "Drift is evidence of data or behavior moving outside the expected envelope, even if user impact is not yet obvious."
    recommended_checks:
      - check: "Inspect the drift components and compare them with the previous baseline"
        why: "Drift often explains why a case started to look abnormal before the health score crossed a threshold."
        expected_result: "The distribution shift is clear and reproducible."
        risk: "LOW"
    limitations: "Drift alone does not prove a service outage or root cause."
    further_reading: "Cross-check with recent operational changes and feature-level variance."
  - cause_category: "RESOURCE_CHANGE"
    title: "Resource profile change"
    definition: "The entity now resembles a different workload or scale profile than it did before."
    how_it_shows_up: "Similarity and related incident history show this entity now aligns with a different resource pattern."
    common_causes:
      - "Capacity expansion or contract migration"
      - "Instance or cluster replacement"
      - "Regional traffic reshaping"
    why_it_matters: "A changed resource profile can amplify customer-facing issues even if the core service has not failed."
    recommended_checks:
      - check: "Review the resource metadata and recent resizing history"
        why: "Resource shape changes are common before a shift in demand or capacity pattern."
        expected_result: "A workload or cluster change matches the evidence."
        risk: "LOW"
    limitations: "This is comparative evidence and should be verified with operational records."
    further_reading: "Match the entity against similar historical episodes and resource inventories."
  - cause_category: "IDENTITY_MISUSE"
    title: "Possible identity or credential misuse"
    definition: "Authentication failures and API activity changed together in a way that can be consistent with a credential being used outside its normal pattern or being guessed."
    how_it_shows_up: "Selected when a versioned credential-misuse or repeated-authentication-failure signature (API calls, authentication failures, or failed logins increasing) matches the case evidence with MEDIUM or HIGH confidence."
    common_causes:
      - "An exposed or stolen credential may be in use, or passwords may be being guessed."
      - "A misconfigured client or expired secret may be retrying with bad credentials."
      - "A credential rotation, new integration, or CI/CD job may change API and sign-in patterns."
    why_it_matters: "Identity misuse can give access to cloud resources; these metrics alone do not show which principal acted or whether access succeeded."
    recommended_checks:
      - check: "Review the identity provider and cloud audit records for ${entity_id} in the alert window."
        why: "Audit records show which principals failed or succeeded and from where."
        expected_result: "Failures and calls are attributed to known principals, or unknown sources are listed for review."
        risk: "LOW"
      - check: "Check for recent credential rotations, new API keys, or client deployments."
        why: "Expired or rotated secrets are a common benign cause of authentication failures."
        expected_result: "A rotation or deployment explains the failures, or none is found and access is reviewed."
        risk: "LOW"
    limitations: "Aggregate counts lack source IP, principal, and session data; a signature match is a lead, not attribution."
    further_reading: "Use identity-provider sign-in logs and cloud audit trails to attribute the activity."
  - cause_category: "CROSS_RESOURCE_ACCESS"
    title: "Possible cross-resource access"
    definition: "Connections between internal resources increased in a way that can be consistent with an identity or workload reaching resources it does not normally use."
    how_it_shows_up: "Selected when the versioned cross-resource access signature (east-west connections increasing, optionally with security-group changes) matches the case evidence with MEDIUM or HIGH confidence."
    common_causes:
      - "A compromised workload or credential may be used to reach adjacent resources."
      - "A new service dependency, migration, or batch job may legitimately open new internal paths."
      - "A network or security-group change may alter normal traffic routes."
    why_it_matters: "Unexpected internal reach can widen the impact of a single compromised resource, but new internal traffic is also a normal part of change."
    recommended_checks:
      - check: "Compare the new internal connection pairs with the approved service dependency map for ${entity_id}."
        why: "Known dependencies explain most new east-west traffic."
        expected_result: "Each new path maps to an approved dependency or is listed for review."
        risk: "LOW"
      - check: "Review recent security-group and network-policy changes in ${region}."
        why: "A policy change can open paths that were previously blocked."
        expected_result: "Changes are linked to an approved request or flagged as unexplained."
        risk: "LOW"
    limitations: "Flow sampling and NAT can hide the true source; connection counts alone do not show which identity initiated the traffic."
    further_reading: "Use read-only VPC or NSG flow logs and the service dependency inventory to corroborate."
  - cause_category: "UNUSUAL_DATA_TRANSFER"
    title: "Possible unusual data transfer"
    definition: "Storage reads and outbound network volume rose together, which can be consistent with data being collected and moved out of its usual location."
    how_it_shows_up: "Selected when the versioned data-transfer signature (storage reads and egress bytes increasing) matches the case evidence with MEDIUM or HIGH confidence."
    common_causes:
      - "An identity or workload may be copying data to an unapproved destination."
      - "A backup, replication, analytics export, or migration job may move large volumes legitimately."
      - "A CDN, cache, or client behaviour change may raise egress without a data-handling concern."
    why_it_matters: "Large unexplained outbound transfers can indicate data exposure; confirming the destination and the actor is the deciding evidence."
    recommended_checks:
      - check: "Identify the destinations of outbound traffic from ${entity_id} during the alert window."
        why: "Known backup or partner destinations explain most large transfers."
        expected_result: "Destinations match approved endpoints, or unknown destinations are listed for review."
        risk: "LOW"
      - check: "Review storage access logs for the principals reading data in the same window."
        why: "Matching the reader to the transfer distinguishes routine jobs from unexpected access."
        expected_result: "Reads are attributed to an approved job or principal."
        risk: "LOW"
    limitations: "Volume metrics do not show content or destination; confirmation requires flow and storage access records."
    further_reading: "Use cloud storage access logs and egress flow records to attribute the transfer."
  - cause_category: "RESOURCE_ABUSE"
    title: "Possible compute or service abuse"
    definition: "Compute, function, or resource-creation activity rose in a way that can be consistent with resources being used for an unapproved purpose."
    how_it_shows_up: "Selected when a versioned resource-abuse signature (for example CPU with unusual egress, serverless invocations and duration, or new resource creation) matches the case evidence with MEDIUM or HIGH confidence."
    common_causes:
      - "Malware, cryptomining, or a compromised function may consume capacity."
      - "A new workload, load test, or scheduled batch job may raise usage legitimately."
      - "An autoscaling or deployment change may create resources as designed."
    why_it_matters: "Abused resources raise cost and can be a foothold for further activity; usage alone does not show intent."
    recommended_checks:
      - check: "List processes, functions, or resources created or started on ${entity_id} around the alert window."
        why: "An unknown process or resource is the clearest indicator of misuse."
        expected_result: "All activity maps to known workloads or deployments."
        risk: "LOW"
      - check: "Compare the usage increase with recent deployments and scaling events."
        why: "Planned changes explain most capacity increases."
        expected_result: "A deployment or scaling event accounts for the change, or the gap is documented."
        risk: "LOW"
    limitations: "Utilization metrics cannot identify the process or actor responsible."
    further_reading: "Use cloud audit logs, instance inventory, and function invocation logs to attribute usage."
  - cause_category: "DESTRUCTIVE_ACTIVITY"
    title: "Possible destructive storage activity"
    definition: "Storage writes increased in a pattern that can be consistent with bulk modification, encryption, or deletion of data."
    how_it_shows_up: "Selected when the versioned destructive-storage signature (write operations increasing, optionally with deletes rising or object counts falling) matches the case evidence with MEDIUM or HIGH confidence."
    common_causes:
      - "Ransomware or a compromised identity may be rewriting or deleting data."
      - "A data migration, compaction, or retention job may rewrite data legitimately."
      - "A faulty deployment may write or delete data unexpectedly."
    why_it_matters: "Bulk destructive changes can be hard to reverse; confirming recoverability early limits impact."
    recommended_checks:
      - check: "Confirm that recent backups or snapshots of the affected storage on ${entity_id} exist and are intact."
        why: "Recovery options determine how urgent containment is."
        expected_result: "A recent restorable backup is confirmed, or the gap is escalated."
        risk: "LOW"
      - check: "Review the principals and jobs writing to the storage during the alert window."
        why: "Attribution separates scheduled jobs from unexpected writers."
        expected_result: "Writers are approved jobs, or unknown writers are listed for review."
        risk: "LOW"
    limitations: "Write volume does not show whether data was encrypted or deleted; object-level audit records are needed."
    further_reading: "Use storage access logs and backup inventory to confirm scope and recoverability."
  - cause_category: "SERVICE_DISRUPTION"
    title: "Possible volumetric service disruption"
    definition: "Request volume, inbound traffic, and latency rose together, which can be consistent with a service being overwhelmed."
    how_it_shows_up: "Selected when the versioned volumetric-disruption signature (requests, ingress, and latency increasing) matches the case evidence with MEDIUM or HIGH confidence."
    common_causes:
      - "A denial-of-service attempt may be flooding the service."
      - "A marketing event, retry storm, or client bug may raise legitimate load."
      - "An upstream dependency slowdown may raise latency and trigger retries."
    why_it_matters: "Sustained overload affects availability; the source distribution of requests separates attacks from organic surges."
    recommended_checks:
      - check: "Review the distribution of request sources and user agents for ${entity_id}."
        why: "Concentrated or unusual sources suggest abuse; broad organic sources suggest real demand."
        expected_result: "Traffic sources are characterized as organic or concentrated."
        risk: "LOW"
      - check: "Check dependency health and error rates in ${region} for the same window."
        why: "Upstream issues can produce the same latency pattern."
        expected_result: "Dependencies are healthy, or a dependency issue explains the latency."
        risk: "LOW"
    limitations: "Aggregate volume metrics cannot distinguish malicious from legitimate clients."
    further_reading: "Use load-balancer access logs and provider DDoS protection reports to corroborate."
  - cause_category: "CONFIGURATION_CHANGE"
    title: "Possible security-relevant configuration change"
    definition: "Configuration, exposure, or logging behaviour changed in a way that can affect the resource's security posture or visibility."
    how_it_shows_up: "Selected when a versioned configuration signature (for example configuration changes with anonymous requests, or a drop in audit log volume) matches the case evidence with MEDIUM or HIGH confidence."
    common_causes:
      - "A resource may have been made public or had logging reduced, accidentally or deliberately."
      - "An approved change window may include configuration and logging updates."
      - "A logging pipeline fault may reduce audit volume without any configuration change."
    why_it_matters: "Exposure and reduced logging both make later incidents harder to detect and investigate."
    recommended_checks:
      - check: "Review configuration and access-policy changes for ${entity_id} in the alert window."
        why: "The change record shows who changed what and whether it was approved."
        expected_result: "Changes map to an approved request, or are flagged as unexplained."
        risk: "LOW"
      - check: "Confirm audit logging is enabled and delivering for the resource."
        why: "A logging gap would hide other activity."
        expected_result: "Audit logs are complete for the window, or the gap is documented."
        risk: "LOW"
    limitations: "Metric-level evidence cannot show the exact setting that changed; configuration history is required."
    further_reading: "Use the provider's configuration history and audit trail to identify the change."
  - cause_category: "DEPLOYMENT_CHANGE"
    title: "Likely deployment-related change"
    definition: "Compute and write activity changed in a pattern consistent with a software rollout or configuration deployment."
    how_it_shows_up: "Selected when the versioned planned-deployment signature (CPU and disk writes rising together) matches the case evidence with MEDIUM or HIGH confidence."
    common_causes:
      - "A planned release or configuration rollout."
      - "An unannounced deployment or hotfix."
      - "A deployment that triggered unexpected resource use."
    why_it_matters: "Linking an alert to a deployment usually resolves it quickly; an unexplained deployment is itself worth reviewing."
    recommended_checks:
      - check: "Match the alert window against the deployment log for ${entity_id}."
        why: "A matching deployment is the most likely explanation."
        expected_result: "A deployment record covers the window, or none exists and the change is reviewed."
        risk: "LOW"
    limitations: "The pattern resembles a deployment; it does not confirm that one happened."
    further_reading: "Use CI/CD history and change-management records."
  - cause_category: "TRAFFIC_CHANGE"
    title: "Gradual workload growth"
    definition: "Request and write volume grew in a gradual pattern consistent with organic demand."
    how_it_shows_up: "Selected when the versioned workload-growth signature matches the case evidence with MEDIUM or HIGH confidence."
    common_causes:
      - "Organic user or customer growth."
      - "A new client or integration adding load."
      - "Seasonal demand."
    why_it_matters: "Growth is usually benign but can approach capacity limits; it may justify re-baselining."
    recommended_checks:
      - check: "Compare the growth rate with business metrics and capacity limits for ${entity_id}."
        why: "Organic growth tracks business activity; capacity headroom determines urgency."
        expected_result: "Growth is explained by demand and capacity is sufficient, or a capacity action is planned."
        risk: "LOW"
    limitations: "A slow ramp can also hide gradual abuse; review sources if growth is unexplained."
    further_reading: "Use traffic analytics and capacity dashboards."
  - cause_category: "CLOUD_PROVIDER_EVENT"
    title: "Possible provider or regional event"
    definition: "Errors and latency rose in a pattern consistent with a provider-side or regional service issue rather than a change in this resource."
    how_it_shows_up: "Selected when the versioned provider-regional-event signature (regional error rate and latency increasing) matches the case evidence with MEDIUM or HIGH confidence."
    common_causes:
      - "A cloud provider incident in ${region}."
      - "A regional network issue between services."
      - "A shared dependency outage."
    why_it_matters: "Provider events need tracking and communication rather than changes to the resource itself."
    recommended_checks:
      - check: "Check the ${cloud_provider} service health dashboard for ${region}."
        why: "A published incident confirms the cause."
        expected_result: "A provider incident matches the window, or none is reported."
        risk: "LOW"
    limitations: "Provider status pages can lag; absence of a posted incident does not rule one out."
    further_reading: "Use the provider's service health history for the region."
  - cause_category: "BASELINE_ACTIVITY"
    title: "Activity consistent with the baseline"
    definition: "The observed signals resemble the resource's normal operating pattern."
    how_it_shows_up: "Selected when the versioned stable-baseline signature matches the case evidence with MEDIUM or HIGH confidence."
    common_causes:
      - "Normal operation that crossed a low alerting threshold."
      - "Minor noise in telemetry."
    why_it_matters: "Recognising normal activity avoids unnecessary investigation and supports tuning thresholds."
    recommended_checks:
      - check: "Confirm the alert score is low and no related incidents are open for ${entity_id}."
        why: "Low scores with no related activity rarely need action."
        expected_result: "The alert can be resolved as expected behaviour, or a related signal is found."
        risk: "LOW"
    limitations: "A baseline-like pattern does not rule out slow changes outside the observed metrics."
    further_reading: "Review entity history before closing repeated low-score alerts."
  - cause_category: "UNKNOWN"
    title: "Unknown or insufficient evidence"
    definition: "The case does not yet match a confident rule and needs a manual review."
    how_it_shows_up: "The score is low or the available evidence is sparse, conflicting, or incomplete."
    common_causes:
      - "Insufficient telemetry"
      - "New failure mode"
      - "Transient or noisy incident"
    why_it_matters: "Unknowns are often the earliest indicator of a new or missing class of issue."
    recommended_checks:
      - check: "Review raw telemetry and incident annotations from the last 2-4 hours"
        why: "Unknown cases usually need more signal before an actionable classification can be reached."
        expected_result: "A clear pattern emerges after additional telemetry review."
        risk: "MEDIUM"
    limitations: "Without enough evidence, the system should avoid overconfident conclusions."
    further_reading: "Continue to collect feature-level evidence before escalating."
signals:
  - signal: "deviation"
    description: "Difference between current behavior and the entity's established baseline."
  - signal: "drift"
    description: "Distributional shift relative to the expected feature envelope."
  - signal: "similarity"
    description: "How closely the current profile resembles known historical incidents or workload patterns."
confidence_levels:
  HIGH: "Strong evidence across multiple independent signals; the classification is stable."
  MEDIUM: "One signal is strong or several are weakly aligned, but there is still some uncertainty."
  LOW: "Evidence is sparse, conflicting, or insufficient for a confident conclusion."
threats:
  credential_theft:
    public_id: cloud_credential_misuse
    title: "Possible cloud credential misuse"
    definition: "The current pattern may be consistent with use of a cloud account outside its established access pattern; it does not establish credential theft."
    how_it_shows_up: "For ${entity_id}, ${top_changed_feature} changed in a ${cloud_provider} ${region} window with severity ${severity}; deviation=${deviation_score}, drift=${drift_score}."
    typical_stages: ["An identity or credential is exposed or misused.", "A session accesses cloud APIs from an unusual context.", "The actor may enumerate or access resources."]
    mitre_attack:
      - {id: "T1078.004", name: "Cloud Accounts", url: "https://attack.mitre.org/techniques/T1078/004/"}
    indicators_in_this_case: [changed_features, cloud_provider, region, component_scores, observed_window]
    investigative_checks:
      - {check: "Compare the identity, source context, and session in the cloud identity audit record.", why: "A sign-in location or API change needs identity-level corroboration.", expected_result: "Your team can attribute the session to an approved user or document an unexplained session for review.", risk: "LOW"}
      - {check: "Review recent access-key, token, and role changes for the affected identity.", why: "Recent credential changes can distinguish rotation from unauthorized persistence.", expected_result: "The changes map to an approved request or remain unverified.", risk: "LOW"}
    mitigation:
      immediate:
        - generic: "Your cloud team can consider revoking the affected session and disabling a credential only after confirming the identity and operational impact."
          aws: "Your team can review IAM access-key last-used data and deactivate a confirmed compromised key."
          azure: "Your team can review Entra ID sign-in logs and revoke the confirmed session."
          gcp: "Your team can review Cloud Audit Logs and disable a confirmed exposed service-account key."
          oci: "Your team can review IAM sign-in and Audit records and rotate a confirmed exposed API key."
      short_term:
        - generic: "Your team can review least-privilege access, MFA, and recent role or token changes for this identity."
          aws: "Consider IAM Access Analyzer and CloudTrail history for the principal."
          azure: "Consider Entra ID Identity Protection and Activity Log review."
          gcp: "Consider IAM recommender findings and Cloud Audit Logs."
          oci: "Consider IAM policy review and OCI Audit history."
      hardening:
        - generic: "Your team can reduce standing credentials, enforce strong authentication, and alert on unusual identity context."
          aws: "Consider IAM roles, short-lived credentials, and GuardDuty."
          azure: "Consider Conditional Access and Defender for Cloud Apps."
          gcp: "Consider workload identity federation and Security Command Center."
          oci: "Consider short-lived credentials, MFA, and Cloud Guard."
    false_positive_notes: "Approved travel, VPN egress, service-account rotation, CI/CD activity, or a new workload can resemble this pattern. Validate the principal and change record before treating it as misuse."
    resolution_criteria: ["The identity and session are attributed.", "Any credential or policy change is authorized or contained by the customer's team.", "Follow-up telemetry no longer shows the unexplained access pattern."]
    limitations: "The case may not contain source IP, principal, session, or authentication outcome data. A signature match is a hypothesis, not attribution."
    further_reading:
      - {title: "MITRE ATT&CK Cloud Accounts", url: "https://attack.mitre.org/techniques/T1078/004/"}

  insider_threat:
    public_id: privilege_policy_misuse
    title: "Possible privilege or policy misuse"
    definition: "Privileged API or data-access changes may be consistent with expanded access beyond an established workload pattern; actor intent is unknown."
    how_it_shows_up: "The case for ${entity_id} has ${top_changed_feature} changing with final score ${final_score}; verify the actual role and policy audit events."
    typical_stages: ["A permission or role changes.", "The changed access is exercised.", "Additional resources or data may be accessed."]
    mitre_attack:
      - {id: "T1098", name: "Account Manipulation", url: "https://attack.mitre.org/techniques/T1098/"}
    indicators_in_this_case: [changed_features, component_scores, similar_episodes, related_incidents]
    investigative_checks:
      - {check: "Review role assignments, policy edits, and role assumptions in the alert window.", why: "The feature pattern alone does not identify which permission changed.", expected_result: "The change is tied to an approved change request or documented as unexplained.", risk: "LOW"}
      - {check: "Compare privileged API activity with the principal's normal task and approved deployment history.", why: "Expected automation can produce the same increase.", expected_result: "The activity has an owner and approved purpose, or is escalated for customer review.", risk: "LOW"}
    mitigation:
      immediate:
        - generic: "Your cloud team can consider limiting a verified over-broad role after checking dependent workloads and incident-response requirements."
          aws: "Consider reviewing IAM policy versions and role trust policies."
          azure: "Consider reviewing Entra ID role assignments and privileged identity activations."
          gcp: "Consider reviewing IAM policy bindings and service-account impersonation grants."
          oci: "Consider reviewing IAM policy statements and dynamic-group membership."
      short_term:
        - generic: "Your team can compare the effective permissions with the approved access request and preserve relevant audit records."
      hardening:
