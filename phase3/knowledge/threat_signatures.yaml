signatures:
  - threat_id: credential_theft
    minimum_score: 4
    conditions:
      metric_signals:
        - {metric_family: api_calls, direction: increase, weight: 2}
        - {metric_family: auth_failures, direction: increase, weight: 2}
      entity_types:
        any_of: [Instances, VM_Instances, Virtual_Machines]
        weight: 1
      namespaces:
        any_of: [AWS/EC2, Microsoft.Compute/virtualMachines, CWAgent]
        weight: 1
      cloud_providers:
        any_of: [AWS, Azure, GCP, OCI]
        weight: 1
      component_patterns:
        - {score: deviation, minimum: 0.4, weight: 2}
        - {score: similarity, maximum: 0.6, weight: 1}
      similar_episode_severities:
        any_of: [MEDIUM, HIGH, CRITICAL]
        weight: 1

  - threat_id: insider_threat
    minimum_score: 4
