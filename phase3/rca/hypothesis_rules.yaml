version: "2026.10.09.1"
rules:
  - id: "rca.credential_theft"
    cause_category: "CREDENTIAL_THEFT"
    confidence: "HIGH"
    condition: "case.final_score >= 0.65 and 'suspicious_login_location' in case.changed_features and ('credential_reset_spike' in case.changed_features or 'iam_policy_change' in case.changed_features)"
    supporting_evidence_keys: ["changed_features", "behavioral_deviation"]
    contradicting_evidence_keys: []
  - id: "rca.privilege_escalation"
    cause_category: "PRIVILEGE_ESCALATION"
    confidence: "HIGH"
    condition: "case.final_score >= 0.65 and 'privilege_escalation_attempt' in case.changed_features and ('new_data_exfiltration_pattern' in case.changed_features or 'file_access_spike' in case.changed_features)"
    supporting_evidence_keys: ["changed_features", "behavioral_deviation"]
    contradicting_evidence_keys: []
  - id: "rca.network_reconnaissance"
    cause_category: "NETWORK_RECONNAISSANCE"
    confidence: "HIGH"
    condition: "case.final_score >= 0.65 and 'port_scan_count' in case.changed_features and ('new_ip_discovery' in case.changed_features or 'lateral_probe_burst' in case.changed_features)"
    supporting_evidence_keys: ["changed_features", "behavioral_deviation"]
    contradicting_evidence_keys: []
  - id: "rca.behavior_change"
    cause_category: "BEHAVIOR_CHANGE"
    confidence: "HIGH"
    condition: "case.final_score >= 0.75 or scores.get('deviation', 0.0) >= 0.75"
    supporting_evidence_keys: ["component_scores", "behavioral_deviation"]
    contradicting_evidence_keys: []
  - id: "rca.drift"
    cause_category: "DRIFT"
    confidence: "MEDIUM"
    condition: "scores.get('drift', 0.0) >= 0.65"
    supporting_evidence_keys: ["component_scores", "drift_evidence"]
    contradicting_evidence_keys: []
  - id: "rca.resource_change"
    cause_category: "RESOURCE_CHANGE"
    confidence: "MEDIUM"
    condition: "scores.get('similarity', 0.0) >= 0.6 or bool(case.related_incidents)"
    supporting_evidence_keys: ["similar_episodes", "related_incidents"]
    contradicting_evidence_keys: []
  - id: "rca.unknown"
    cause_category: "UNKNOWN"
    confidence: "LOW"
    condition: "True"
    supporting_evidence_keys: []
    contradicting_evidence_keys: ["component_scores"]
# Threat-signature evidence (phase3/knowledge/threat_signatures.yaml) maps to a
# cause category. When a signature matches with MEDIUM or HIGH confidence the
# engine adds a candidate with that category, ranked ahead of the generic
# score-based categories (BEHAVIOR_CHANGE, DRIFT, RESOURCE_CHANGE, UNKNOWN).
# Signatures without an entry here (e.g. ambiguous_change) add no candidate.
threat_categories:
  credential_theft: "IDENTITY_MISUSE"
  brute_force_login: "IDENTITY_MISUSE"
  insider_threat: "PRIVILEGE_ESCALATION"
  network_scan: "NETWORK_RECONNAISSANCE"
  lateral_movement: "CROSS_RESOURCE_ACCESS"
  data_exfiltration: "UNUSUAL_DATA_TRANSFER"
  malware_execution: "RESOURCE_ABUSE"
  function_abuse: "RESOURCE_ABUSE"
  rogue_resources: "RESOURCE_ABUSE"
  ransomware: "DESTRUCTIVE_ACTIVITY"
  ddos_volumetric: "SERVICE_DISRUPTION"
  public_exposure: "CONFIGURATION_CHANGE"
  log_tampering: "CONFIGURATION_CHANGE"
  planned_deployment: "DEPLOYMENT_CHANGE"
  organic_growth: "TRAFFIC_CHANGE"
  provider_regional_event: "CLOUD_PROVIDER_EVENT"
  benign_baseline: "BASELINE_ACTIVITY"
