# Copy to live_mode.yaml (git-ignored) and fill in real values.
# A tenant is EITHER synthetic OR live — never mixed — per Section 16.1.

tenants:
  google-demo:
    source_mode: synthetic

  microsoft-demo:
    source_mode: synthetic

  amazon-demo:
    source_mode: synthetic

  oracle-demo:
    source_mode: synthetic

  acme-demo:
    source_mode: synthetic

  my-real-account:
    source_mode: live
    providers: [aws, azure, gcp, oci]
    poll_interval_sec: 300
    max_events_per_poll: 1000
    dry_run: true
    feature_meta_path: "config/feature_meta.json"
