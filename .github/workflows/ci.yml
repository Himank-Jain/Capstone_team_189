name: CI

"on":
  push:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      # Keep this non-blocking until the repository-wide lint cleanup lands.
      - name: Flake8
        run: flake8 --config=.flake8
        continue-on-error: true
      - name: Run Python test suite
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, typecheck, test, and build frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

  integration:
    if: github.ref == 'refs/heads/dev'
    needs: python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: capstone_test
          POSTGRES_USER: capstone
          POSTGRES_PASSWORD: capstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capstone -d capstone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CAPSTONE_TEST_DATABASE_URL: postgresql+psycopg://capstone:capstone@localhost:5432/capstone_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run integration test suite
        run: python -m pytest -q tests/integration
      - name: Verify real Redis entity store
        run: python -m tests.integration.phase2.test_entity_store_real_redis
