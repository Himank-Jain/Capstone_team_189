services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: capstone-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: capstone-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7.4-alpine
    container_name: capstone-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  platform_postgres:
    image: pgvector/pgvector:pg16
    container_name: capstone-platform-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      # Local development only; never use this credential in a deployed environment.
      POSTGRES_PASSWORD: platform
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data

volumes:
  platform_postgres_data: